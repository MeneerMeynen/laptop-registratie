# Automatisch geladen door `docker compose` — dev-modus met live code-mount.
# Productie/CI zonder mount: `docker compose -f compose.yaml up --build`
services:
  app:
    environment:
      UVICORN_RELOAD: "1"
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      # Behoud de in de image gedownloade zxing-wasm bestanden (anders verborgen door de mount)
      - /app/app/static/zxing-wasm
