server {
    listen 80;
    server_name _;

    # Serve the mkcert root CA so mobile devices can install it
    location = /rootCA.crt {
        alias /etc/nginx/certs/rootCA.crt;
        default_type application/x-x509-ca-cert;
    }

    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Serve the mkcert root CA so mobile devices can install it
    location = /rootCA.crt {
        alias /etc/nginx/certs/rootCA.crt;
        default_type application/x-x509-ca-cert;
    }

    # Increase upload limit for photo uploads
    client_max_body_size 20M;

    # /health is publiek in de app (geen login) en onthult versie, databasehost
    # en aantallen. update.sh en diagnose.sh vragen het rechtstreeks op poort
    # 8000 op, dus via nginx hoeft het niet bereikbaar te zijn.
    location = /health {
        deny all;
    }

    # Docker's embedded DNS. Without a variable in proxy_pass, nginx resolves
    # "app" once at startup and keeps that IP — after the app container is
    # recreated (new IP) every request fails with 502 until nginx restarts.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream_app app:8000;

    location / {
        proxy_pass         http://$upstream_app;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
